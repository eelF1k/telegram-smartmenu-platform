services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartmenu
      POSTGRES_USER: smartmenu
      POSTGRES_PASSWORD: smartmenu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  bot:
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    depends_on:
      - api
      - redis

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
