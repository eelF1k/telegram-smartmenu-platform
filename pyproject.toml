[project]
name = "telegram-smartmenu-platform"
version = "0.1.0"
description = "SmartMenu Telegram platform monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.12.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.0.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "aiosmtplib>=3.0.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "api*", "shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
